spring.application.name=project

# 1. Địa chỉ kết nối CSDL (Đã sửa lại đúng tên Database: Lab2_AdvancedBackend)
spring.datasource.url=jdbc:mysql://localhost:3306/Lab2_AdvancedBackend?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# 2. Tài khoản và Mật khẩu MySQL
spring.datasource.username=root
spring.datasource.password=123456

# 3. Khai báo Driver MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 4. Cấu hình Hibernate (Sửa lại đúng chuẩn của Spring Boot JPA)
spring.jpa.hibernate.ddl-auto=none

# 5. Cho phép in câu lệnh SQL ra Terminal để kiểm tra
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true